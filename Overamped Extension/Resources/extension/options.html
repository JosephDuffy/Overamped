<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="build/options.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        font: -apple-system-body;
        font-family: system-ui;
        --linkColour: #007aff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --linkColour: #0984ff;
        }
      }

      body {
        display: flex;
        align-items: center;
        min-height: -webkit-fill-available;
        text-align: center;
      }

      a,
      a:visited {
        color: var(--linkColour);
      }

      #withJSMessage {
        display: none;
      }

      @media (scripting: enabled) {
        #withJSMessage {
          display: reset;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p>
        Overamped settings are managed in the Overamped app. You can try
        <a href="https://overamped.app/settings">opening the app</a>.
      </p>
    </noscript>
    <p id="withJSMessage">
      Overamped settings are managed in the Overamped app. If you are not
      redirected automatically, you can try
      <a href="https://overamped.app/settings">opening the app</a>.
    </p>
  </body>
</html>
